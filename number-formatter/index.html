<body>

<div class="container">

  <div class="header">
    <div class="badge"><i class="ti ti-123"></i> Utility by Dashrath Sharma</div>
    <h1 class="title">Number Formatter</h1>
    <p class="subtitle">Compact notation across currencies &amp; locales</p>
  </div>

  <div class="card">

    <!-- Quick currency pills -->
    <div class="field">
      <p class="label"><i class="ti ti-coins"></i> Quick select</p>
      <div class="currency-pills" id="pills"></div>
    </div>

    <!-- Locale dropdown -->
    <div class="field">
      <p class="label"><i class="ti ti-world"></i> Currency / Locale</p>
      <div class="select-wrapper">
        <select id="localeSelect"></select>
        <i class="ti ti-chevron-down"></i>
      </div>
    </div>

    <!-- Number input -->
    <div class="field">
      <p class="label"><i class="ti ti-keyboard"></i> Number</p>
      <div class="input-wrapper">
        <i class="ti ti-hash"></i>
        <input id="numInput" type="number" placeholder="Enter a number..." />
      </div>
    </div>

    <div class="divider"></div>

    <!-- Output -->
    <div class="output-section">
      <p class="output-label">Formatted output</p>
      <div class="output-value empty" id="formattedOutput">—</div>
      <div class="output-raw" id="rawOutput"></div>
    </div>

  </div>

</div>
